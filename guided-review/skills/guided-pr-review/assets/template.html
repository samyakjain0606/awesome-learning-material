<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky tab bar; Guide = overview row (prose | before/after flow), then one chapter per idea as two columns (sticky prose | diffs); Ask panel docks on the right. */
:root{
  --bg:#f6f7f5; --surface:#ffffff; --surface-2:#eff1ed; --line:#e2e5df; --line-2:#c9cec5;
  --fg:#191c18; --fg-2:#4b5149; --muted:#80877d;
  --add-bg:#e9f6ec; --add-bg-2:#d2ecd9; --add:#1c7a3b;
  --del-bg:#fcecea; --del-bg-2:#f5d3cf; --del:#b2322b;
  --chg-bg:#fbf2de; --chg:#966006;
  --accent:#2c58cc; --accent-bg:#e7edfb;
  --risk:#c13f0c; --risk-bg:#fdeee5;
  --sel:#fff1b8; --sel-2:#f7df7a;
  --k-kw:#972c84; --k-str:#0c6a72; --k-num:#a95400; --k-com:#878e84; --k-fn:#2c58cc; --k-type:#755700; --k-attr:#5847c0; --k-meta:#687066;
  --shadow:0 1px 2px rgb(18 22 18 / .06), 0 10px 28px rgb(18 22 18 / .10);
  --ui:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bar-h:52px; --ask-w:460px; --side-w:340px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111311; --surface:#181b18; --surface-2:#1f231f; --line:#2a2f29; --line-2:#3b4239;
  --fg:#e5e8e2; --fg-2:#b1b7ad; --muted:#7c8479;
  --add-bg:#132a1b; --add-bg-2:#1a3d26; --add:#6fcf8e;
  --del-bg:#301817; --del-bg-2:#47211e; --del:#f2897f;
  --chg-bg:#2d2412; --chg:#e0b45b;
  --accent:#7ea3ff; --accent-bg:#1c2640;
  --risk:#ff9a6b; --risk-bg:#33200f;
  --sel:#3d3511; --sel-2:#5b4f17;
  --k-kw:#e79ad9; --k-str:#6fd3cc; --k-num:#f2b072; --k-com:#7b8578; --k-fn:#8fb0ff; --k-type:#e3c66f; --k-attr:#b6a8ff; --k-meta:#98a194;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 12px 32px rgb(0 0 0 / .45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111311; --surface:#181b18; --surface-2:#1f231f; --line:#2a2f29; --line-2:#3b4239;
  --fg:#e5e8e2; --fg-2:#b1b7ad; --muted:#7c8479;
  --add-bg:#132a1b; --add-bg-2:#1a3d26; --add:#6fcf8e;
  --del-bg:#301817; --del-bg-2:#47211e; --del:#f2897f;
  --chg-bg:#2d2412; --chg:#e0b45b;
  --accent:#7ea3ff; --accent-bg:#1c2640;
  --risk:#ff9a6b; --risk-bg:#33200f;
  --sel:#3d3511; --sel-2:#5b4f17;
  --k-kw:#e79ad9; --k-str:#6fd3cc; --k-num:#f2b072; --k-com:#7b8578; --k-fn:#8fb0ff; --k-type:#e3c66f; --k-attr:#b6a8ff; --k-meta:#98a194;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 12px 32px rgb(0 0 0 / .45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar-h) + 16px)}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,kbd,pre{font-family:var(--mono)}
:not(pre)>code{font-size:.86em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 .3em;white-space:break-spaces}
kbd{font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.6}
input[type=checkbox]{accent-color:var(--add);width:14px;height:14px;margin:0;cursor:pointer}

/* Bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1480px;margin:0 auto;padding-inline:24px;height:var(--bar-h);display:flex;align-items:center;gap:14px}
.tabs{display:inline-flex;gap:2px;padding:3px;background:var(--surface-2);border-radius:9px}
.tab{padding:4px 12px;border-radius:7px;font-size:13px;color:var(--fg-2);transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.bar-id{font:500 12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar-sp{flex:1}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog-t{width:90px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog-f{height:100%;width:0;background:var(--add);border-radius:2px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.ask-btn{display:inline-flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap}
.ask-btn:hover{opacity:.9}
.ask-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--add)}
.ask-btn.off .dot{background:var(--muted)}

/* Shell */
.shell{transition:padding-right .3s cubic-bezier(.2,.8,.2,1)}
@media (min-width:1280px){body.ask-open .shell{padding-right:var(--ask-w)}}
main{max-width:1480px;margin:0 auto;padding-inline:24px;padding-block:28px 140px}
.pr-head h1{font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-.012em;margin:0 0 8px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .av{width:18px;height:18px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:inline-grid;place-items:center;font:600 10px var(--ui);color:var(--fg-2);margin-right:6px;text-transform:uppercase}
.meta .who{display:inline-flex;align-items:center;color:var(--fg-2)}
.meta .br{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border-radius:4px;padding:1px 6px;color:var(--fg-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a{color:var(--add)} .d{color:var(--del)}
.num{font:500 12px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.panel{margin-top:28px}

/* Overview row */
.ov{display:grid;grid-template-columns:minmax(0,var(--side-w)) minmax(0,1fr);gap:36px;align-items:start}
.ov.solo{grid-template-columns:minmax(0,720px)}
.ov h2,.sec-h{font-size:16px;font-weight:600;margin:0 0 10px;letter-spacing:-.005em}
.prose{color:var(--fg-2);font-size:13.5px;line-height:1.62;max-width:65ch}
.prose p{margin:0 0 10px}
.prose ol{margin:0 0 12px;padding-left:20px;display:grid;gap:6px}
.toc{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:2px}
.toc-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.toc a{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 8px;margin-inline:-8px;border-radius:6px;color:var(--fg-2);font-size:13px}
.toc a:hover{background:var(--surface-2);text-decoration:none;color:var(--fg)}
.toc a.on{color:var(--fg)}
.toc .n{font:500 11.5px var(--mono);color:var(--muted)}
.toc .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc .ok{width:14px;height:14px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center}
.toc .ok.done{background:var(--add);border-color:var(--add)}
.toc .ok.done::after{content:"";width:6px;height:3px;border:solid var(--bg);border-width:0 0 1.5px 1.5px;transform:translateY(-1px) rotate(-45deg)}

.dg-col{display:grid;gap:16px;min-width:0;align-content:start}
.dg-wide{margin-top:20px;min-width:0}
.dg-wide:empty{display:none}
.dg-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px 14px;min-width:0;margin:0}
.dg-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dg-h b{font-size:13px;font-weight:600}
.seg{display:inline-flex;padding:2px;background:var(--surface-2);border-radius:7px;gap:2px}
.seg button{padding:2px 9px;border-radius:5px;font-size:12px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.legend{margin-left:auto;display:flex;gap:10px;font:500 11.5px var(--mono);color:var(--muted)}
.legend .la{color:var(--add)} .legend .lc{color:var(--chg)} .legend .lr{color:var(--del)}
.dg-replay{font-size:12px;color:var(--muted);padding:2px 7px;border-radius:5px}
.dg-replay:hover{background:var(--surface-2);color:var(--fg)}
.legend:empty+.dg-replay{margin-left:auto}
.dg-cap{font-size:12.5px;color:var(--muted);margin:2px 0 10px;max-width:80ch}
.dg-scroll{overflow-x:auto;padding-bottom:4px;margin-top:8px}
.dg-cap+.dg-scroll{margin-top:0}
.dg-scroll svg{display:block;max-width:none}
svg.dg text{font:500 12px var(--mono);fill:var(--fg);transition:fill .35s}
svg.dg .link{cursor:pointer}
svg.dg .box{fill:var(--surface);stroke:var(--line-2);stroke-width:1;transition:fill .35s,stroke .35s}
svg.dg .box2{fill:none;stroke:var(--line-2);stroke-width:1}
svg.dg .nb{font-size:10.5px;fill:var(--muted)}
svg.dg .en{font-weight:600}
svg.dg .ni{transition:opacity .35s;transform-box:fill-box;transform-origin:center}
svg.dg .link:hover .box,svg.dg .link:focus-visible .box{stroke:var(--fg-2)}
svg.dg .ep{fill:none;stroke:var(--line-2);stroke-width:1.25;transition:opacity .35s,stroke .35s}
svg.dg .el{font-size:10.5px;fill:var(--muted)}
svg.dg .elb{fill:var(--surface)}
svg.dg .sdot{fill:var(--fg)}
svg.dg marker path{fill:var(--line-2)}
svg.dg marker.mk-added path{fill:var(--add)}
svg.dg marker.mk-changed path{fill:var(--chg)}
svg.dg marker.mk-removed path{fill:var(--del)}
svg.dg .esep{stroke:var(--line)}
svg.dg .frb{fill:transparent;transition:fill .35s}
svg.dg .fm{font-size:11px;fill:var(--muted)}
svg.dg .fn2{font-size:11.5px}
svg.dg .ft2{font-size:11px;fill:var(--muted)}
svg.dg .life{stroke:var(--line-2);stroke-dasharray:3 4}
svg.dg .msg{fill:none;stroke:var(--fg-2);stroke-width:1.25;transition:stroke .35s,opacity .35s}
svg.dg .msg.reply{stroke-dasharray:5 4}
svg.dg .ml{font-size:11.5px}
svg.dg .mn{fill:var(--surface-2);stroke:var(--line-2)}
svg.dg .mnt{font-size:10px;fill:var(--fg-2)}
svg.dg .note-b{fill:var(--chg-bg)}
svg.dg .nt{font:12px var(--ui);fill:var(--fg-2)}
svg.dg .dv{stroke:var(--line-2);stroke-dasharray:2 3}
svg.dg .step,svg.dg .edge,svg.dg .fr{transition:opacity .35s}
svg.dg.mode-after .st-added .box{fill:var(--add-bg);stroke:var(--add)}
svg.dg.mode-after .st-changed .box{fill:var(--chg-bg);stroke:var(--chg)}
svg.dg.mode-after .node.st-removed .ni{opacity:.4}
svg.dg.mode-after .st-removed .box{fill:var(--del-bg);stroke:var(--del);stroke-dasharray:3 3}
svg.dg.mode-after .st-removed .nl{text-decoration:line-through}
svg.dg.mode-after .st-added .ep,svg.dg.mode-after .st-added .msg{stroke:var(--add)}
svg.dg.mode-after .st-changed .ep,svg.dg.mode-after .st-changed .msg{stroke:var(--chg)}
svg.dg:not(.draw).mode-after .st-removed .ep,svg.dg:not(.draw).mode-after .st-removed .msg{stroke:var(--del);stroke-dasharray:3 3;opacity:.5}
svg.dg.mode-after .step.st-added .ml,svg.dg.mode-after .fr.st-added .fn2,svg.dg.mode-after .fr.st-added .fm{fill:var(--add)}
svg.dg.mode-after .step.st-changed .ml,svg.dg.mode-after .fr.st-changed .fn2,svg.dg.mode-after .fr.st-changed .fm{fill:var(--chg)}
svg.dg.mode-after .fr.st-added .frb{fill:var(--add-bg)}
svg.dg.mode-after .fr.st-removed text{fill:var(--del);text-decoration:line-through}
svg.dg.mode-before .node.st-added .ni,svg.dg.mode-before .edge.st-added,svg.dg.mode-before .step.st-added,svg.dg.mode-before .fr.st-added{opacity:.12}
svg.dg.mode-before .st-added .box{stroke-dasharray:3 3}
svg.dg .node.hot .box,svg.dg .step.hot .msg{stroke:var(--fg);stroke-width:1.6}
svg.dg.draw .ep,svg.dg.draw .msg{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .65s cubic-bezier(.3,.7,.2,1) forwards;animation-delay:var(--d)}
svg.dg.draw .ni{animation:pop .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
svg.dg.draw .el,svg.dg.draw .elb,svg.dg.draw .ml,svg.dg.draw .mn,svg.dg.draw .mnt,svg.dg.draw .note-b,svg.dg.draw .nt,svg.dg.draw .dv,svg.dg.draw .fr{animation:fade .45s both;animation-delay:var(--d)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
@keyframes fade{from{opacity:0}}

/* Chapters */
.chapter{display:grid;grid-template-columns:minmax(0,var(--side-w)) minmax(0,1fr);gap:36px;padding-block:44px;border-top:1px solid var(--line);margin-top:44px}
.chapter+.chapter{margin-top:0}
.ch-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 20px);align-self:start;max-height:calc(100vh - var(--bar-h) - 40px);overflow-x:hidden;overflow-y:auto;padding-inline:6px 4px;margin-left:-6px;scrollbar-width:thin}
.ch-title{font-size:17px;line-height:1.35;font-weight:600;letter-spacing:-.008em;margin:0 0 6px;text-wrap:balance}
.ch-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-bottom:14px}
.ch-row .n{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.ch-row label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.tier{font:500 10.5px var(--mono);letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tier.core{color:var(--fg);border-color:var(--line-2)}
.tier.kept{border-style:dashed}
.toc a.kept .t{color:var(--muted)}
.toc .kn{font:500 10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ch-main>.dg-col{margin-bottom:2px}
.ch-files{display:grid;gap:1px;margin:14px 0 4px}
.frow{display:grid;grid-template-columns:auto minmax(0,auto) minmax(0,1fr) auto;align-items:center;gap:7px;padding:3px 6px;margin-inline:-6px;border-radius:5px;font-size:12.5px;text-align:left;width:calc(100% + 12px)}
.frow:hover{background:var(--surface-2)}
.frow .fn{color:var(--fg);white-space:nowrap}
.frow .fd{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow.done .fn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.ft{font:600 9px/1 var(--mono);letter-spacing:.02em;padding:3px 3px;border-radius:3px;min-width:20px;text-align:center;color:var(--muted);background:color-mix(in srgb,currentColor 13%,transparent)}
.ft-py,.ft-ts{color:var(--k-fn)} .ft-js{color:var(--k-num)} .ft-md{color:var(--add)} .ft-sh{color:var(--k-str)} .ft-cfg{color:var(--k-attr)} .ft-db{color:var(--k-num)} .ft-json{color:var(--k-meta)} .ft-go,.ft-rs{color:var(--k-str)} .ft-kt,.ft-sw{color:var(--k-kw)}
.blk-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.watch{display:grid;gap:8px}
.w{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:12.5px;line-height:1.5;color:var(--fg-2);padding:8px 10px;border-radius:7px;background:var(--surface);border:1px solid var(--line)}
.w .lv{font:600 9.5px/1.9 var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:0 5px;border-radius:3px}
.lv-risk{color:var(--risk);background:var(--risk-bg)} .lv-question{color:var(--accent);background:var(--accent-bg)} .lv-nit{color:var(--muted);background:var(--surface-2)}
.w .wa{display:flex;gap:10px;margin-top:4px;font-size:12px}
.w .wa button{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;line-height:1.35;text-align:left;padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);transition:border-color .15s,background .15s,color .15s}
.chip:hover{border-color:var(--accent);color:var(--fg);background:var(--accent-bg)}
.chip.deep{border-style:dashed}
.ch-main{display:grid;gap:16px;min-width:0;align-content:start}

/* File blocks */
.file{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:clip;min-width:0}
.file-h{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar-h));z-index:3;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12.5px;min-width:0}
.file.folded .file-h{border-bottom-color:transparent}
.fold{width:18px;height:18px;display:grid;place-items:center;border-radius:4px;color:var(--muted);flex:none}
.fold:hover{background:var(--surface-2);color:var(--fg)}
.fold svg{transition:transform .2s}
.file.folded .fold svg{transform:rotate(-90deg)}
.file-h .fname{font-weight:500;white-space:nowrap}
.file-h .fdir{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.st{font:500 10.5px var(--mono);color:var(--muted);flex:none}
.st-added{color:var(--add)} .st-removed{color:var(--del)} .st-renamed{color:var(--chg)}
.ibtn{font-size:12px;color:var(--muted);padding:2px 6px;border-radius:5px;flex:none}
.ibtn:hover{background:var(--surface-2);color:var(--fg)}
.rev{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;cursor:pointer;flex:none;padding-left:4px}
.file-note{padding:8px 14px;font-size:12.5px;color:var(--fg-2);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.file.folded .file-b,.file.folded .file-note{display:none}
.file-b{overflow-x:auto}
.file-msg{padding:16px;font-size:12.5px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn-s{font-size:12.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg)}
.btn-s:hover{border-color:var(--fg-2)}
table.code{border-collapse:collapse;width:100%;font:12.5px/1.62 var(--mono);font-variant-ligatures:none;tab-size:4}
table.code td{padding:0;vertical-align:top}
td.lo,td.ln{width:1%;min-width:44px;padding:0 8px !important;text-align:right;color:var(--muted);user-select:none;-webkit-user-select:none;cursor:pointer;font-variant-numeric:tabular-nums;font-size:11.5px}
td.lo:hover,td.ln:hover{color:var(--fg)}
td.lm{width:18px;text-align:center;color:var(--muted);user-select:none;-webkit-user-select:none}
td.lc{white-space:pre;padding-right:20px !important;color:var(--fg)}
tr.add td{background:var(--add-bg)} tr.add td.lo,tr.add td.ln{background:var(--add-bg-2)} tr.add td.lm{color:var(--add)}
tr.del td{background:var(--del-bg)} tr.del td.lo,tr.del td.ln{background:var(--del-bg-2)} tr.del td.lm{color:var(--del)}
tr.sel td{background:var(--sel) !important} tr.sel td.lo,tr.sel td.ln{background:var(--sel-2) !important;color:var(--fg)}
tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{0%,35%{background:var(--sel-2)}}

function fileDiffText(f, cap = 28000) {
  let s = `--- ${f.path} (${f.status}${f.prev ? ' from ' + f.prev : ''}, +${f.add} -${f.del})\n`;

  for (const hk of f.hunks) {
    s += `@@ -${hk.o},${hk.oc} +${hk.n},${hk.nc} @@ ${hk.ctx || ''}\n`;
    for (const [t, o, n, text] of hk.lines) {
      s += `${(t === '-' ? 'o' + o : String(n)).padStart(6)} ${t} ${text}\n`;
      if (s.length > cap) return s + `… (diff truncated; ${lineCount(f)} lines total. Use read_file for exact ranges.)\n`;
    }
  }
  return s;
}
function chapterDiff(ci, cap) {
  let s = '';

    const left = cap - s.length;
    if (left < 600) { s += `--- ${f.path} (+${f.add} -${f.del}; not included, use read_diff)\n`; continue; }
    s += fileDiffText(f, left) + '\n';
  }

}

- Ground every claim in code you have actually read. Use the tools to read diffs, read whole files (before or after the PR), and search before describing code you have not seen in this conversation.
- Cite code as path:line using after-PR line numbers, e.g. src/payments/retry.py:120 or src/payments/retry.py:120-134. The page turns these into links that jump to the line, so cite generously. For removed lines, cite the old line as path:line and say it was removed.

${(PR.body || '(none)').slice(0, 6000)}

${[].concat(ov.summary || []).join('\n')}
${(ov.steps || []).map((x, i) => `${i + 1}. ${x}`).join('\n')}

function autosize() { const t = $('#q'); t.style.height = 'auto'; t.style.height = Math.min(180, t.scrollHeight) + 'px'; }
$('#q').addEventListener('input', () => { autosize(); updateSend(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!Ask.busy) askNow($('#q').value, undefined); } });
$('#sendBtn').addEventListener('click', () => { if (Ask.busy) Ask.busy.abort(); else askNow($('#q').value, undefined); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-askflag]');
  if (!b) return;
  const [ci, wi] = b.dataset.askflag.split(':').map(Number);
  const w = CHAPTERS[ci]?.watch?.[wi];
  if (!w) return;
  askNow(`Is this a real problem? "${w.text}" Show me the code path that triggers it, how likely it is in practice, and what the fix would be.`, { kind: 'flag', ch: ci, path: w.path, line: w.line, text: w.text });
});

/* ---------- review comments ---------- */
// Drafted here against exact diff lines, saved in the artifact's db, posted to GitHub by Claude Code
// (scripts/post_review.py) when the user says "post my review". GitHub only takes inline comments on
// lines in the diff, so anything else is saved as a file note and goes into the review body.
function inDiff(path, line, side) {
  const f = FILE_BY_PATH.get(path);
  if (!f || !line) return false;
  return (f.hunks || []).some(hk => hk.lines.some(([t, o, n]) => side === 'LEFT' ? (o === line && t !== '+') : (n === line && t !== '-')));
}
function anchorLabel(c) {
  const nm = splitPath(c.path)[1];
  if (!c.line) return nm;
  return `${nm}:${c.startLine && c.startLine < c.line ? c.startLine + '–' : ''}${c.line}${c.side === 'LEFT' ? ' (old)' : ''}`;
}
function selAnchor() {
  const f = SEL.blk._f;
  const ns = SEL.rows.map(r => +r.dataset.n).filter(Boolean), os = SEL.rows.filter(r => !r.dataset.n).map(r => +r.dataset.o).filter(Boolean);
  const side = ns.length ? 'RIGHT' : 'LEFT', nums = ns.length ? ns : os;
  const line = Math.max(...nums), start = Math.min(...nums);
  return { path: f.path, line, startLine: start < line ? start : null, side, fileLevel: !(inDiff(f.path, line, side) && inDiff(f.path, start, side)) };
}
const fileOrder = (p) => FILE_BY_PATH.get(p)?.idx ?? 9999;
const mine = (c) => !RV.uid || !c.author || c.author === RV.uid;
const myDrafts = () => RV.comments.filter(c => c.status === 'draft' && mine(c)).sort((a, b) => fileOrder(a.path) - fileOrder(b.path) || (a.line || 0) - (b.line || 0));
const evLabel = (e) => e === 'APPROVE' ? 'Approve' : e === 'REQUEST_CHANGES' ? 'Request changes' : 'Comment';
async function initReview() {
  try {
    if (!window.claude?.use) throw 0;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db) throw 0;
    RV.db = db;
    RV.uid = user ? await user.id() : null;
    const can = user ? await user.can('data.write') : null;
    RV.state = can === false ? 'readonly' : 'ready';
    db.collection('review_comments').onSnapshot((snap) => { RV.comments = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderReview(); paintDrafts(); },
      (e) => { RV.state = 'off'; RV.err = e?.code; renderReview(); });
    db.collection('review_submissions').orderBy('createdAt', 'desc').limit(10).onSnapshot((snap) => { RV.subs = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderReview(); }, () => {});
  } catch { RV.state = 'absent'; }
  renderReview();
}
function cboxOf(c, opts = {}) {
  const head = h('div', { class: 'ch' }, h('span', { class: `pillst ${c.status}` }, c.status === 'posted' ? 'on GitHub' : c.status),
    opts.link ? h('button', { class: 'lnk', onclick: () => { if (innerWidth < 1280) toggleReview(false); goTo(c.path, c.line, { side: c.side === 'LEFT' ? 'old' : 'new', to: 0 }); } }, anchorLabel(c)) : h('b', {}, anchorLabel(c)),
    c.fileLevel ? h('span', {}, '· file note') : null, h('span', { class: 'sp' }));
  const body = h('div', { class: 'cb', text: c.body });
  const box_ = h('div', { class: 'cbox' }, head, body);
  if (c.status === 'draft' && mine(c) && RV.state === 'ready') {
    head.append(h('button', { onclick: () => editComment(c, box_, body) }, 'Edit'), h('button', { onclick: () => deleteComment(c) }, 'Delete'));
  }
  return box_;
}
function paintDrafts(only) {
  const blocks = only ? [only] : $$('.file');
  blocks.forEach(blk => blk.querySelectorAll('tr.cmt:not(.new)').forEach(r => r.remove()));
  if (!RV.comments.length) return;
  for (const blk of blocks) {
    if (!blk._built) continue;
    const tbody = blk.querySelector('tbody');
    if (!tbody) continue;
    const list = RV.comments.filter(c => c.path === blk.dataset.path);
    for (const c of list) {
      const row = c.line && !c.fileLevel ? findRow(blk, c.line, c.side === 'LEFT' ? 'old' : 'new') : null;
      let after = row;
      while (after?.nextElementSibling?.matches('tr.note, tr.cmt')) after = after.nextElementSibling;
      const tr = h('tr', { class: 'cmt', 'data-id': c.id }, h('td', { colspan: '4' }, cboxOf(c)));
      if (after) after.after(tr); else tbody.prepend(tr);
    }
  }
}
function closeComposer() { RV.composer?.remove(); RV.composer = null; }
function openComposer(a, prefill = '') {
  if (RV.state !== 'ready') { toggleReview(true); return; }
  closeComposer();
  const f = FILE_BY_PATH.get(a.path);
  if (!f) return;
  if (TAB !== 'guide' && TAB !== 'diff') setTab('guide');
  const pre = TAB === 'diff' ? 'd' : 'g';
  const blk = $(`#${pre}-f${f.idx}`);
  if (!blk) return;
  blk.classList.remove('folded');
  buildBody(blk, lineCount(f) > 1200 || f.kind === 'generated' || f.kind === 'test');
  const row = a.line && !a.fileLevel ? findRow(blk, a.line, a.side === 'LEFT' ? 'old' : 'new') : null;
  let after = row;
  while (after?.nextElementSibling?.matches('tr.note, tr.cmt')) after = after.nextElementSibling;
  const ta = h('textarea', { 'aria-label': 'Comment' });
  ta.value = prefill;
  const add = h('button', { class: 'btn-p' }, 'Add to review');
  const msg = h('span', { class: 'rv-note' }, a.fileLevel ? 'Not a line in the diff, so GitHub gets this as a file note in the review.' : '');
  const cbx = h('div', { class: 'cbox' }, h('div', { class: 'ch' }, h('b', {}, anchorLabel(a)), h('span', { class: 'sp' })), ta,
    h('div', { class: 'crow' }, add, h('button', { class: 'btn-s', onclick: closeComposer }, 'Cancel'), msg));
  const tbody = blk.querySelector('tbody');
  let holder;
  if (tbody) { holder = h('tr', { class: 'cmt new' }, h('td', { colspan: '4' }, cbx)); if (after) after.after(holder); else tbody.prepend(holder); }
  else { holder = h('div', { style: 'padding:10px 14px' }, cbx); blk.querySelector('.file-b').prepend(holder); }
  RV.composer = holder;
  add.addEventListener('click', async () => {
    const body = ta.value.trim();
    if (!body) { ta.focus(); return; }
    add.disabled = true;
    try {
      await RV.db.collection('review_comments').doc().set({ path: a.path, line: a.line ?? null, startLine: a.startLine ?? null, side: a.side || 'RIGHT',
        fileLevel: !!a.fileLevel, body, status: 'draft', author: RV.uid, createdAt: new Date().toISOString(), headSha: PR.headSha });
      closeComposer();
    } catch (e) {
      add.disabled = false;
      msg.textContent = e?.code === 'quota_exceeded' ? 'This review is full. Delete some drafts first.' : 'Couldn’t save the comment. Try again.';
    }
  });
  (holder.scrollIntoViewIfNeeded ? holder.scrollIntoViewIfNeeded() : holder.scrollIntoView({ block: 'center' }));
  ta.focus({ preventScroll: true });
}
function editComment(c, cbx, bodyEl) {
  const ta = h('textarea', { 'aria-label': 'Edit comment' });
  ta.value = c.body;
  const save = h('button', { class: 'btn-p' }, 'Save');
  const row = h('div', { class: 'crow' }, save, h('button', { class: 'btn-s', onclick: () => { ta.remove(); row.remove(); bodyEl.hidden = false; } }, 'Cancel'));
  bodyEl.hidden = true;
  cbx.append(ta, row);
  ta.focus();
  save.addEventListener('click', async () => {
    const body = ta.value.trim();
    if (!body || body === c.body) { ta.remove(); row.remove(); bodyEl.hidden = false; return; }
    save.disabled = true;
    try { await RV.db.doc('review_comments/' + c.id).update({ body }); } catch { save.disabled = false; }
  });
}
async function deleteComment(c) { try { await RV.db.doc('review_comments/' + c.id).delete(); } catch {} }
function statusCard(s) {
  const n = (s.commentIds || []).length, what = `${evLabel(s.event)} with ${n} line comment${n === 1 ? '' : 's'}`;
  if (s.status === 'posted') return h('div', { class: 'rv-status posted' }, h('b', {}, 'Posted to GitHub'), h('span', {}, what + '.'),
    s.url ? h('a', { href: s.url, target: '_blank', rel: 'noopener' }, 'Open the review on GitHub ↗') : null);
  if (s.status === 'failed') return h('div', { class: 'rv-status failed' }, h('b', {}, 'GitHub didn’t accept the review'), h('span', {}, s.error || 'No reason given.'),
    h('span', { class: 'rv-note' }, 'Your comments are back in drafts. Change what’s needed and submit again.'));
  const phrase = `post my review for #${PR.number}`;
  const code = h('code', {}, phrase);
  const copy = h('button', { class: 'btn-s' }, 'Copy');
  copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(phrase); copy.textContent = 'Copied'; } catch { const r = document.createRange(); r.selectNodeContents(code); getSelection().removeAllRanges(); getSelection().addRange(r); } });
  return h('div', { class: `rv-status ${s.status}` }, h('b', {}, s.status === 'posting' ? 'Posting to GitHub…' : 'Ready for GitHub'),
    h('span', {}, `${what}. In your Claude Code session, say:`), h('div', { class: 'copy-row' }, code, copy));
}
function renderReview() {
  const drafts = myDrafts();
  $('#revCnt').textContent = drafts.length ? String(drafts.length) : '';
  $('#revBtn').classList.toggle('off', RV.state !== 'ready');
  $('#rvCount').textContent = drafts.length ? `${drafts.length} draft${drafts.length === 1 ? '' : 's'}` : '';
  const list = $('#rvList');
  list.innerHTML = '';
  if (RV.state === 'absent' || RV.state === 'off') list.append(h('div', { class: 'ask-off' }, 'Review comments work when this page is open on claude.ai. They’re saved with the page, then Claude Code posts them to GitHub.'));
  else if (RV.state === 'readonly') list.append(h('div', { class: 'ask-off' }, 'You can read this review, but you can’t add comments to it.'));
  else if (!drafts.length) list.append(h('div', { class: 'empty' }, h('p', {}, 'No comments yet.'),
    h('p', { class: 'foot-n' }, 'Click a line number in any diff (shift-click to extend), then choose Comment. Look closely flags have a Comment button too.')));
  const groups = new Map();
  drafts.forEach(c => { if (!groups.has(c.path)) groups.set(c.path, []); groups.get(c.path).push(c); });
  groups.forEach((cs, path) => list.append(h('div', { class: 'rv-file' }, h('b', {}, path), cs.map(c => cboxOf(c, { link: true })))));
  const st = $('#rvStatus');
  st.innerHTML = '';
  if (RV.subs[0]) st.append(statusCard(RV.subs[0]));
  const selfPR = !!PR.poster && PR.poster === PR.author;
  if (selfPR && RV.event !== 'COMMENT') RV.event = 'COMMENT';
  $$('#rvEvent button').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.ev === RV.event)); if (b.dataset.ev !== 'COMMENT') b.disabled = selfPR; });
  const body = $('#rvBody').value.trim();
  const pending = RV.subs.some(x => x.status === 'queued' || x.status === 'posting');
  $('#rvSubmit').disabled = RV.state !== 'ready' || RV.busy || pending || (RV.event !== 'APPROVE' && !drafts.length && !body);
  $('#rvSubmit').textContent = RV.busy ? 'Saving…' : 'Submit review';
  $('#rvHow').textContent = `Claude Code posts it to GitHub${PR.poster ? ' as @' + PR.poster : ''}, pinned to commit ${String(PR.headSha).slice(0, 7)}.` + (selfPR ? ' You opened this PR, so GitHub only allows a comment review.' : '');
  if (RV.err) $('#rvHow').textContent += ' Last save failed: ' + RV.err + '.';
}
async function submitReview() {
  const drafts = myDrafts(), body = $('#rvBody').value.trim();
  RV.busy = true; RV.err = null; renderReview();
  try {
    const ref = RV.db.collection('review_submissions').doc();
    await ref.set({ event: RV.event, body, commentIds: drafts.map(d => d.id), status: 'queued', author: RV.uid,
      createdAt: new Date().toISOString(), headSha: PR.headSha, repo: PR.repo, number: PR.number });
    for (const d of drafts) await RV.db.doc('review_comments/' + d.id).update({ status: 'queued', submission: ref.id });
    $('#rvBody').value = '';
  } catch (e) { RV.err = e?.code || 'unavailable'; }
  RV.busy = false; renderReview();
}
function toggleReview(open) {
  const p = $('#rpanel'), on = open ?? !p.classList.contains('open');
  if (on) { $('#ask').classList.remove('open'); $('#askBtn').setAttribute('aria-expanded', 'false'); }
  p.classList.toggle('open', on);
  document.body.classList.toggle('ask-open', on || $('#ask').classList.contains('open'));
  $('#revBtn').setAttribute('aria-expanded', String(on));
  if (on) renderReview();
}
$('#revBtn').addEventListener('click', () => toggleReview());
$('#closeRv').addEventListener('click', () => toggleReview(false));
$('#rvBody').addEventListener('input', () => renderReview());
$$('#rvEvent button').forEach(b => b.addEventListener('click', () => { if (b.disabled) return; RV.event = b.dataset.ev; renderReview(); }));
$('#rvSubmit').addEventListener('click', () => { if (!$('#rvSubmit').disabled) submitReview(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-cmtflag]');
  if (!b) return;
  const [ci, wi] = b.dataset.cmtflag.split(':').map(Number);
  const w = CHAPTERS[ci]?.watch?.[wi];
  if (!w || !w.path) return;
  const side = w.side === 'old' ? 'LEFT' : 'RIGHT';
  openComposer({ path: w.path, line: w.line || null, startLine: null, side, fileLevel: !inDiff(w.path, w.line, side) }, w.text.replace(/\*\*/g, ''));
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  const typing = e.target.closest('input, textarea, [contenteditable]');
  if (e.key === 'Escape') { if (SEL) clearSel(); else if (RV.composer && typing) closeComposer(); else if ($('#rpanel').classList.contains('open') && !$('.viewer')) toggleReview(false); else if ($('#ask').classList.contains('open') && !$('.viewer')) toggleAsk(false); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); toggleAsk(true); }
  else if ((e.key === 'j' || e.key === 'k') && TAB === 'guide' && CHAPTERS.length) {
    const cur = CUR_CH ?? -1;
    goChapter(Math.max(0, Math.min(CHAPTERS.length - 1, cur + (e.key === 'j' ? 1 : -1))));
  }
});
addEventListener('resize', () => { if (SEL) showChip(); });

setCtx(null);
initSample();

const hm = /^#ch-(\d+)$/.exec(location.hash);
if (hm) setTimeout(() => goChapter(+hm[1] - 1), 60);
})();
